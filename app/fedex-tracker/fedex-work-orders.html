<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FedEx Work Order Tracker</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #172026;
        --muted: #5c6b73;
        --line: #d6dee3;
        --panel: #ffffff;
        --soft: #f4f7f8;
        --brand: #4d148c;
        --accent: #ff6600;
        --good: #167a4b;
        --warn: #a06100;
        --bad: #aa2d2d;
        font-family: Arial, Helvetica, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: #edf1f3;
        color: var(--ink);
      }

      button, input, textarea, select { font: inherit; }

      button {
        border: 1px solid var(--brand);
        border-radius: 6px;
        background: var(--brand);
        color: #fff;
        min-height: 38px;
        padding: 0 12px;
        cursor: pointer;
        font-weight: 700;
      }

      button.secondary {
        background: #fff;
        color: var(--brand);
      }

      button.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--brand);
      }

      button.danger {
        border-color: var(--bad);
        background: var(--bad);
      }

      input, textarea, select {
        width: 100%;
        border: 1px solid #b9c5cc;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        min-height: 38px;
        padding: 8px 10px;
      }

      textarea { resize: vertical; }

      label {
        display: grid;
        gap: 6px;
        color: #33434c;
        font-size: 13px;
        font-weight: 700;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        border-right: 1px solid var(--line);
        background: #fff;
        padding: 22px;
        overflow: auto;
      }

      .main {
        padding: 22px;
        overflow: auto;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 18px;
      }

      .brand h1 {
        margin: 0;
        font-size: 25px;
        line-height: 1.08;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .fedex-mark {
        display: inline-flex;
        align-items: center;
        gap: 0;
        min-width: 92px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -.5px;
      }

      .fed { color: var(--brand); }
      .ex { color: var(--accent); }

      .toolbar, .filters, .form-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .toolbar { margin-bottom: 14px; }

      .filters {
        display: grid;
        grid-template-columns: 1fr 150px;
        margin-bottom: 14px;
      }

      .filter-field {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .location-pages {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }

      .location-page {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        min-height: 42px;
        padding: 8px 10px;
        text-align: left;
      }

      .location-page.active {
        border-color: var(--brand);
        background: #f5effb;
      }

      .location-page.billing {
        border-color: #167a4b;
        background: #f1fbf6;
      }

      .location-page.canceled {
        border-color: #b7791f;
        background: #fff8e7;
      }

      .location-page strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .location-page span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 16px 0;
      }

      .stat {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        padding: 12px;
      }

      .stat strong {
        display: block;
        font-size: 25px;
      }

      .stat span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .list {
        display: grid;
        gap: 10px;
      }

      .list-section-title {
        width: 100%;
        margin: 8px 0 0;
        border: 1px solid #b7d8c6;
        border-left: 5px solid var(--good);
        border-radius: 8px;
        background: #eefaf3;
        color: #163f2b;
        padding: 10px 12px;
        font-size: 15px;
        font-weight: 800;
        text-align: left;
        cursor: pointer;
      }

      .list-section-title:hover {
        background: #dcf4e6;
      }

      .work-card {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 12px;
        text-align: left;
      }

      .work-card.active {
        border-color: var(--brand);
        box-shadow: inset 4px 0 0 var(--brand);
      }

      .work-card.old-job {
        border-color: var(--bad);
        background: #fff5f5;
        box-shadow: inset 4px 0 0 var(--bad);
      }

      .work-card.old-job.active {
        border-color: var(--bad);
      }

      .work-card h3 {
        margin: 0 0 6px;
        font-size: 15px;
      }

      .work-card p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 800;
        background: #e8edf0;
        color: #34434b;
        white-space: nowrap;
      }

      .pill.progress { background: #e7f0ff; color: #255da8; }
      .pill.quote { background: #fff2dd; color: var(--warn); }
      .pill.ready { background: #e8f6ef; color: var(--good); }
      .pill.done { background: #e6f4ea; color: var(--good); }
      .pill.blocked { background: #fae8e8; color: var(--bad); }
      .pill.old { background: #fde2e2; color: var(--bad); }

      .card-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 16px;
        margin-bottom: 14px;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-size: 18px;
      }

      .detail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .detail-head h2 {
        margin: 0 0 5px;
        font-size: 25px;
      }

      .detail-head p {
        margin: 0;
        color: var(--muted);
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .wide { grid-column: 1 / -1; }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(190px, 1fr));
        gap: 12px;
      }

      .column {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        min-height: 180px;
        padding: 12px;
      }

      .column h3 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 10px;
        font-size: 14px;
      }

      .mini-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 8px;
        background: var(--soft);
      }

      .mini-card.old-job {
        border-color: var(--bad);
        background: #fff5f5;
      }

      .mini-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .mini-card span {
        color: var(--muted);
        font-size: 12px;
      }

      .summary {
        border-left: 4px solid var(--accent);
        background: #fff8f2;
      }

      .empty {
        border: 1px dashed #b9c5cc;
        border-radius: 8px;
        padding: 18px;
        color: var(--muted);
        text-align: center;
      }

      .hidden { display: none !important; }

      @media (max-width: 980px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
        .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 640px) {
        .sidebar, .main { padding: 16px; }
        .filters, .field-grid, .board, .location-page { grid-template-columns: 1fr; }
        .detail-head { display: grid; }
      }

      @media print {
        .sidebar, .toolbar, .form-actions, .filters { display: none; }
        .app { display: block; }
        .main { padding: 0; }
        body { background: #fff; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <header class="brand">
          <div>
            <p class="eyebrow">Operations Tracker</p>
            <h1>Work Orders</h1>
          </div>
          <div class="fedex-mark" aria-label="FedEx"><span class="fed">Fed</span><span class="ex">Ex</span></div>
        </header>

        <div class="toolbar">
          <button id="newButton" type="button">+ New</button>
          <button id="exportButton" class="secondary" type="button">Export</button>
          <button id="printButton" class="secondary" type="button">Print</button>
          <label class="ghost-label">
            <input id="importFile" class="hidden" type="file" accept=".json,.csv,.xlsx,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
            <button id="importButton" class="secondary" type="button">Import</button>
          </label>
          <button class="secondary" type="button" onclick="window.location.href='/fedex-invoice-review'">Invoice Ready</button>
          <button class="secondary" type="button" onclick="window.location.href='/pm-report'">PM Form</button>
        </div>

        <div id="locationPages" class="location-pages" aria-label="Location pages"></div>

        <div class="filters">
          <label class="filter-field">Search all open jobs
            <input id="searchInput" type="search" placeholder="Example: general repairs" />
          </label>
          <label class="filter-field">Status
            <select id="statusFilter" aria-label="Filter by status">
              <option value="all">All open status</option>
            </select>
          </label>
        </div>

        <section class="stats" aria-label="Work order summary">
          <div class="stat"><strong id="totalCount">0</strong><span>Total</span></div>
          <div class="stat"><strong id="openCount">0</strong><span>Open</span></div>
          <div class="stat"><strong id="quoteCount">0</strong><span>Needs Quote</span></div>
          <div class="stat"><strong id="doneCount">0</strong><span>Done</span></div>
        </section>

        <div id="workList" class="list" aria-label="Work order list"></div>
      </aside>

      <main class="main">
        <section class="panel summary">
          <div class="detail-head">
            <div>
              <p id="pageEyebrow" class="eyebrow">All Jobs</p>
              <h2 id="selectedTitle">Choose a work order</h2>
              <p id="selectedMeta">Add, update, and track field status from one screen.</p>
            </div>
            <span id="selectedStatus" class="pill">No selection</span>
          </div>
        </section>

        <section class="panel">
          <h2>Work Order Details</h2>
          <form id="workForm">
            <div class="field-grid">
              <label>
                Tracking number
                <input id="trackingNumber" name="trackingNumber" required />
              </label>
              <label>
                Location ID / name
                <input id="location" name="location" required />
              </label>
              <label>
                Class of work
                <input id="classOfWork" name="classOfWork" />
              </label>
              <label>
                Status
                <select id="status" name="status"></select>
              </label>
              <label>
                Cost / NTE
                <input id="cost" name="cost" placeholder="NTE 2500" />
              </label>
              <label>
                Priority
                <select id="priority" name="priority">
                  <option>Normal</option>
                  <option>High</option>
                  <option>Low</option>
                </select>
              </label>
              <label>
                Assigned to
                <input id="assignedTo" name="assignedTo" placeholder="Technician or owner" />
              </label>
              <label>
                Due date
                <input id="dueDate" name="dueDate" type="date" />
              </label>
              <label>
                Call date
                <input id="callDate" name="callDate" type="date" />
              </label>
              <label class="wide">
                Job description
                <textarea id="jobDescription" name="jobDescription" rows="6"></textarea>
              </label>
              <label class="wide">
                Additional notes
                <textarea id="notes" name="notes" rows="5"></textarea>
              </label>
              <label class="wide">
                Next step
                <input id="nextStep" name="nextStep" placeholder="Example: Order switch, send quote, schedule lift" />
              </label>
            </div>
            <div class="form-actions" style="margin-top: 14px;">
              <button type="submit">Save Changes</button>
              <button id="duplicateButton" class="secondary" type="button">Duplicate</button>
              <button id="deleteButton" class="danger" type="button">Delete</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2>Status Board</h2>
          <div id="board" class="board"></div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

      const readyToBillPage = "__ready_to_bill";
      const canceledPage = "__canceled";
      const oldJobDays = 45;
      const fields = ["trackingNumber", "location", "classOfWork", "status", "cost", "priority", "assignedTo", "dueDate", "callDate", "jobDescription", "notes", "nextStep"];

      function loadOrders() {
        const saved = localStorage.getItem(storageKey);
        if (!saved) {
          localStorage.setItem(storageKey, JSON.stringify(defaultOrders));
          return defaultOrders;
        }
        try {
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed) || !parsed.length) return defaultOrders;
          const merged = mergeDefaultOrders(parsed);
          localStorage.setItem(storageKey, JSON.stringify(merged));
          return merged;
        } catch {
          return defaultOrders;
        }
      }

      function mergeDefaultOrders(savedOrders) {
        const seenTracking = new Set(savedOrders.map(order => String(order.trackingNumber || "").trim()).filter(Boolean));
        const missingDefaults = defaultOrders.filter(order => !seenTracking.has(String(order.trackingNumber || "").trim()));
        return [...savedOrders, ...missingDefaults];
      }

            let remoteSyncEnabled = false;

      async function loadRemoteOrders() {
        try {
          const response = await fetch("/api/fedex-work-orders", { credentials: "same-origin" });
          if (!response.ok) throw new Error(`Server returned ${response.status}`);
          const remoteOrders = await response.json();
          if (Array.isArray(remoteOrders) && remoteOrders.length) {
            orders = remoteOrders;
            localStorage.setItem(storageKey, JSON.stringify(orders));
            selectedId = orders[0]?.id || null;
          }
          remoteSyncEnabled = true;
          saveOrders();
          render();
        } catch (error) {
          console.warn("FedEx tracker is using local browser storage only:", error);
        }
      }

      async function saveOrders() {
        localStorage.setItem(storageKey, JSON.stringify(orders));
        try {
          const response = await fetch("/api/fedex-work-orders", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ orders })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `Server returned ${response.status}`);
          remoteSyncEnabled = true;
          return { shared: true, saved: result.saved || orders.length };
        } catch (error) {
          console.warn("Unable to save work orders to shared storage:", error);
          return { shared: false, error: error.message || "Shared save failed." };
        }
      }

      function statusClass(status) {
        if (status === "In progress" || status === "Scheduled") return "progress";
        if (status === "Need to quote" || status === "Waiting on parts") return "quote";
        if (status === "NTS") return "ready";
        if (status === "Completed") return "done";
        if (status === "Canceled") return "blocked";
        return "";
      }

      function selectedOrder() {
        return orders.find(order => order.id === selectedId) || orders[0] || null;
      }

      function normalizeLocation(location) {
        return (location || "Unassigned Location").trim() || "Unassigned Location";
      }

      function getOrderCallDate(order) {
        if (order.callDate) return order.callDate;
        const match = String(order.notes || "").match(/Call date:\s*(\d{4}-\d{2}-\d{2})/i);
        return match ? match[1] : "";
      }

      function getOrderAgeDays(order) {
        const callDate = getOrderCallDate(order);
        if (!callDate) return 0;
        const start = new Date(`${callDate}T00:00:00`);
        if (Number.isNaN(start.getTime())) return 0;
        const today = new Date();
        const localToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        return Math.floor((localToday - start) / 86400000);
      }

      function isOldJob(order) {
        return getOrderAgeDays(order) > oldJobDays;
      }

      function locations() {
        return [...new Set(orders.map(order => normalizeLocation(order.location)))].sort((a, b) => a.localeCompare(b));
      }

      function pageOrders() {
        if (activeLocation === "all") return orders.filter(order => order.status !== "Completed");
        if (activeLocation === readyToBillPage) return orders.filter(order => order.status === "Completed");
        if (activeLocation === canceledPage) return orders.filter(order => order.status === "Canceled");
        return orders.filter(order => normalizeLocation(order.location) === activeLocation);
      }

      function ensureActivePage() {
        if (activeLocation === "all" || activeLocation === readyToBillPage || activeLocation === canceledPage) return;
        if (!locations().includes(activeLocation)) activeLocation = "all";
      }

      function ensureSelectedVisible() {
        const selected = selectedOrder();
        const visibleOnPage = selected && pageOrders().some(order => order.id === selected.id);
        if (visibleOnPage) return;
        selectedId = pageOrders()[0]?.id || orders[0]?.id || null;
      }

      function filteredOrders() {
        const term = els.search.value.trim().toLowerCase();
        const status = els.statusFilter.value;
        const source = term && ![readyToBillPage, canceledPage].includes(activeLocation)
          ? orders.filter(order => !["Completed", "Canceled"].includes(order.status))
          : pageOrders();
        return source.filter(order => {
          const haystack = [order.trackingNumber, order.location, order.classOfWork, order.status, order.cost, order.priority, order.jobDescription, order.notes, order.nextStep, order.assignedTo, order.callDate].join(" ").toLowerCase();
          const matchesSearch = !term || haystack.includes(term);
          const matchesStatus = status === "all" || order.status === status;
          return matchesSearch && matchesStatus;
        });
      }

      function searchResultExcerpt(order) {
        const term = els.search.value.trim().toLowerCase();
        const defaultText = String(order.nextStep || order.jobDescription || order.notes || "");
        if (!term) return defaultText;
        const sources = [order.jobDescription, order.notes, order.nextStep].map(value => String(value || ""));
        const matched = sources.find(value => value.toLowerCase().includes(term));
        if (!matched) return defaultText;
        const matchAt = matched.toLowerCase().indexOf(term);
        const startAt = Math.max(0, matchAt - 45);
        const endAt = Math.min(matched.length, matchAt + term.length + 85);
        return `${startAt > 0 ? "…" : ""}${matched.slice(startAt, endAt)}${endAt < matched.length ? "…" : ""}`;
      }

      function fillOptions() {
        const statusSelect = document.querySelector("#status");
        statusSelect.innerHTML = statuses.map(status => `<option>${status}</option>`).join("");
        els.statusFilter.insertAdjacentHTML("beforeend", statuses.map(status => `<option>${status}</option>`).join(""));
      }

      function renderLocationPages() {
        const openJobs = items => items.filter(order => !["Completed", "Canceled"].includes(order.status)).length;
        const readyToBill = orders.filter(order => order.status === "Completed");
        const canceled = orders.filter(order => order.status === "Canceled");
        const allJobs = orders.filter(order => order.status !== "Completed");
        const locationButtons = locations().map(location => {
          const items = orders.filter(order => normalizeLocation(order.location) === location);
          return `
            <button class="location-page ${activeLocation === location ? "active" : ""}" type="button" data-location="${escapeHtml(location)}">
              <strong>${escapeHtml(location)}</strong>
              <span>${items.length} jobs</span>
              <span>${openJobs(items)} open</span>
            </button>
          `;
        }).join("");

        els.locationPages.innerHTML = `
          <button class="location-page ${activeLocation === "all" ? "active" : ""}" type="button" data-location="all">
            <strong>All Jobs</strong>
            <span>${allJobs.length} total</span>
            <span>${openJobs(allJobs)} open</span>
          </button>
          <button class="location-page billing ${activeLocation === readyToBillPage ? "active" : ""}" type="button" data-location="${readyToBillPage}">
            <strong>All Jobs Completed</strong>
            <span>${readyToBill.length} jobs</span>
            <span>completed</span>
          </button>
          <button class="location-page canceled ${activeLocation === canceledPage ? "active" : ""}" type="button" data-location="${canceledPage}">
            <strong>Canceled</strong>
            <span>${canceled.length} jobs</span>
            <span>not billable</span>
          </button>
          ${locationButtons}
        `;
      }

      function renderStats() {
        const items = pageOrders();
        els.totalCount.textContent = items.length;
        els.openCount.textContent = items.filter(order => !["Completed", "Canceled"].includes(order.status)).length;
        els.quoteCount.textContent = items.filter(order => order.status === "Need to quote" || order.cost === "NTQ").length;
        els.doneCount.textContent = items.filter(order => order.status === "Completed").length;
      }

      function renderList() {
        const visible = filteredOrders();
        if (!visible.length) {
          els.list.innerHTML = `<div class="empty">No work orders match the current filters.</div>`;
          return;
        }
        const cardHtml = order => {
          const excerpt = searchResultExcerpt(order);
          return `
          <button class="work-card ${order.id === selectedId ? "active" : ""} ${isOldJob(order) ? "old-job" : ""}" type="button" data-id="${order.id}">
            <div class="card-row">
              <h3>${escapeHtml(order.trackingNumber)} - ${escapeHtml(order.classOfWork || "Unclassified")}</h3>
              <span class="pill ${statusClass(order.status)}">${escapeHtml(order.status)}</span>
            </div>
            <p>${escapeHtml(order.location)} - ${escapeHtml(order.cost || "No cost limit")}${order.callDate ? ` - Call ${escapeHtml(order.callDate)}` : ""}</p>
            ${isOldJob(order) ? `<p><span class="pill old">${getOrderAgeDays(order)} days old</span></p>` : ""}
            <p>${escapeHtml(excerpt).slice(0, 150)}${excerpt.length > 150 ? "..." : ""}</p>
          </button>
        `;
        };

        const isLocationPage = !["all", readyToBillPage, canceledPage].includes(activeLocation);
        if (isLocationPage && !els.search.value.trim()) {
          const currentJobs = visible.filter(order => order.status !== "Completed");
          const completedJobs = visible.filter(order => order.status === "Completed");
          if (locationCompletedView) {
            els.list.innerHTML = `
              <button class="list-section-title" type="button" data-completed-view="open">← Back to Open Jobs</button>
              ${completedJobs.length ? completedJobs.map(cardHtml).join("") : `<div class="empty">No completed jobs at this location.</div>`}
            `;
          } else {
            els.list.innerHTML = `
              <button class="list-section-title" type="button" data-completed-view="completed">Completed Jobs (${completedJobs.length})</button>
              ${currentJobs.length ? currentJobs.map(cardHtml).join("") : `<div class="empty">No open jobs at this location.</div>`}
            `;
          }
          return;
        }

        els.list.innerHTML = visible.map(cardHtml).join("");
      }

      function renderBoard() {
        const groups = activeLocation === readyToBillPage
          ? ["Completed"]
          : activeLocation === canceledPage
            ? ["Canceled"]
          : ["NTS", "Scheduled", "In progress", "Need to quote", "Waiting on parts", "Completed"];
        els.board.innerHTML = groups.map(status => {
          const items = pageOrders().filter(order => order.status === status);
          const cards = items.length ? items.map(order => `
            <div class="mini-card ${isOldJob(order) ? "old-job" : ""}">
              <strong>${escapeHtml(order.trackingNumber)}</strong>
              <span>${escapeHtml(order.classOfWork || "Work order")} - ${escapeHtml(order.cost || "No cost")}${order.callDate ? ` - ${escapeHtml(order.callDate)}` : ""}</span>
              <span>${escapeHtml(order.nextStep || "No next step set")}</span>
              ${isOldJob(order) ? `<span class="pill old">${getOrderAgeDays(order)} days old</span>` : ""}
            </div>
          `).join("") : `<div class="empty">Nothing here</div>`;
          return `<section class="column"><h3>${status}<span>${items.length}</span></h3>${cards}</section>`;
        }).join("");
      }

      function renderDetail() {
        const order = selectedOrder();
        const disable = !order;
        els.pageEyebrow.textContent = activeLocation === readyToBillPage ? "All Jobs Completed" : (activeLocation === canceledPage ? "Canceled" : (activeLocation === "all" ? "All Jobs" : activeLocation));
        fields.forEach(name => {
          const field = document.querySelector(`#${name}`);
          field.disabled = disable;
          field.value = order ? order[name] || "" : "";
        });
        document.querySelector("#duplicateButton").disabled = disable;
        document.querySelector("#deleteButton").disabled = disable;
        if (!order) {
          els.selectedTitle.textContent = "Choose a work order";
          els.selectedMeta.textContent = "Add, update, and track field status from one screen.";
          els.selectedStatus.textContent = "No selection";
          els.selectedStatus.className = "pill";
          return;
        }
        els.selectedTitle.textContent = `${order.trackingNumber} - ${order.classOfWork || "Work Order"}`;
        const ageLabel = isOldJob(order) ? ` - ${getOrderAgeDays(order)} days old` : "";
        els.selectedMeta.textContent = `${order.location} - ${order.cost || "No cost limit"} - Priority ${order.priority || "Normal"}${ageLabel}`;
        els.selectedStatus.textContent = order.status;
        els.selectedStatus.className = `pill ${statusClass(order.status)}`;
      }

      function render() {
        ensureActivePage();
        ensureSelectedVisible();
        renderLocationPages();
        renderStats();
        renderList();
        renderDetail();
        renderBoard();
      }

      function upsertFromForm(event) {
        event.preventDefault();
        const order = selectedOrder();
        const data = Object.fromEntries(fields.map(name => [name, document.querySelector(`#${name}`).value.trim()]));
        if (order) {
          Object.assign(order, data);
        } else {
          selectedId = crypto.randomUUID();
          orders.unshift({ id: selectedId, ...data });
        }
        saveOrders();
        render();
      }

      function createOrder() {
        const newOrder = {
          id: crypto.randomUUID(),
          trackingNumber: "",
          location: ["all", readyToBillPage, canceledPage].includes(activeLocation) ? "0912 // South SF" : activeLocation,
          classOfWork: "",
          jobDescription: "",
          cost: "",
          status: "NTS",
          priority: "Normal",
          assignedTo: "",
          dueDate: "",
          callDate: new Date().toISOString().slice(0, 10),
          notes: "",
          nextStep: ""
        };
        orders.unshift(newOrder);
        selectedId = newOrder.id;
        saveOrders();
        render();
        document.querySelector("#trackingNumber").focus();
      }

      function duplicateOrder() {
        const order = selectedOrder();
        if (!order) return;
        const copy = { ...order, id: crypto.randomUUID(), trackingNumber: `${order.trackingNumber}-copy`, status: "NTS" };
        orders.unshift(copy);
        selectedId = copy.id;
        saveOrders();
        render();
      }

      function deleteOrder() {
        const order = selectedOrder();
        if (!order || !confirm(`Delete work order ${order.trackingNumber || "without tracking number"}?`)) return;
        orders = orders.filter(item => item.id !== order.id);
        selectedId = orders[0]?.id || null;
        saveOrders();
        render();
      }

      function exportOrders() {
        const blob = new Blob([JSON.stringify(orders, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `fedex-work-orders-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      function importOrders(file) {
        const extension = file.name.split(".").pop().toLowerCase();
        if (extension === "xlsx") {
          importExcelReport(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            if (extension === "csv") {
              const imported = parseCsv(reader.result).map(mapImportedRow).filter(Boolean);
              const result = upsertImportedOrders(imported);
              const sync = await saveOrders();
              if (!sync.shared) throw new Error(`The file was saved only in this browser. ${sync.error}`);
              alert(`Import complete. ${result.created} new jobs and ${result.updated} existing jobs were saved to the shared tracker.`);
            } else {
              const imported = JSON.parse(reader.result);
              if (!Array.isArray(imported)) throw new Error("Imported JSON must contain a work order array.");
              orders = imported.map(order => ({ ...mapImportedRow(order), id: order.id || crypto.randomUUID() })).filter(Boolean);
              selectedId = orders[0]?.id || null;
              const sync = await saveOrders();
              if (!sync.shared) throw new Error(`The file was saved only in this browser. ${sync.error}`);
            }
            render();
          } catch (error) {
            alert(`Import failed: ${error.message}`);
          }
        };
        reader.readAsText(file);
      }

      function importExcelReport(file) {
        if (!window.XLSX) {
          alert("Excel import needs the XLSX parser library. If this computer is offline or blocks cdn.jsdelivr.net, save the FedEx report as CSV and import the CSV instead.");
          return;
        }
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const workbook = XLSX.read(reader.result, { type: "array", cellDates: true });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
            const imported = rows.map(mapImportedRow).filter(Boolean);
            const result = upsertImportedOrders(imported);
            const sync = await saveOrders();
            if (!sync.shared) throw new Error(`The file was saved only in this browser. ${sync.error}`);
            render();
            alert(`Import complete. ${result.created} new jobs and ${result.updated} existing jobs were saved to the shared tracker.`);
          } catch (error) {
            alert(`Excel import failed: ${error.message}`);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let value = "";
        let quoted = false;
        for (let index = 0; index < text.length; index += 1) {
          const char = text[index];
          const next = text[index + 1];
          if (char === '"' && quoted && next === '"') {
            value += '"';
            index += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(value);
            value = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") index += 1;
            row.push(value);
            if (row.some(cell => cell.trim())) rows.push(row);
            row = [];
            value = "";
          } else {
            value += char;
          }
        }
        row.push(value);
        if (row.some(cell => cell.trim())) rows.push(row);
        const headers = rows.shift() || [];
        return rows.map(cells => Object.fromEntries(headers.map((header, index) => [header.trim(), cells[index] || ""])));
      }

      function getImportValue(row, names) {
        for (const name of names) {
          if (row[name] !== undefined && row[name] !== null && String(row[name]).trim() !== "") return String(row[name]).trim();
        }
        return "";
      }

      function mapImportedRow(row) {
        const trackingNumber = getImportValue(row, ["trackingNumber", "TrackingNumber", "Tracking #", "Tracking Number"]);
        if (!trackingNumber) return null;
        const rawStatus = getImportValue(row, ["status", "Status"]);
        const rawStatusExt = getImportValue(row, ["statusExt", "StatusExt", "Status Ext."]);
        const rawPriority = getImportValue(row, ["priority", "Priority"]);
        const nte = getImportValue(row, ["cost", "CostNTE", "Cost", "NTE"]);
        const callDate = normalizeImportDate(getImportValue(row, ["callDate", "CallDate", "Call Date"]));
        const dueDate = normalizeImportDate(getImportValue(row, ["dueDate", "DueDate", "Sched. Date", "Scheduled Date"]));
        const additionalNotes = getImportValue(row, ["notes", "AdditionalNotes", "Additional Notes", "Notes"]);
        const sourceNotes = [
          ["Call date", callDate],
          ["Submitted by", getImportValue(row, ["Submitted by"])],
          ["Area", getImportValue(row, ["Area"])],
          ["Equipment", getImportValue(row, ["Equipment"])],
          ["Source status", rawStatus],
          ["Status detail", rawStatusExt],
          ["Source priority", rawPriority]
        ].filter(([, value]) => value).map(([label, value]) => `${label}: ${value}`);

        return {
          id: row.id || crypto.randomUUID(),
          trackingNumber,
          location: normalizeImportedLocation(getImportValue(row, ["location", "Location", "Locations ID // Name", "Store"])),
          classOfWork: toTitleCase(getImportValue(row, ["classOfWork", "ClassOfWork", "Class of Work", "Trade"])),
          jobDescription: getImportValue(row, ["jobDescription", "JobDescription", "Job Description", "Problem Description"]),
          cost: formatImportedCost(nte),
          status: mapImportedStatus(rawStatus || getImportValue(row, ["Status"]), rawStatusExt),
          priority: mapImportedPriority(rawPriority),
          assignedTo: getImportValue(row, ["assignedTo", "AssignedTo", "Assigned to Technician(s)", "Assignee"]),
          dueDate,
          callDate,
          notes: additionalNotes || sourceNotes.join("\n"),
          nextStep: getImportValue(row, ["nextStep", "NextStep", "Next Step"]) || (dueDate ? `Schedule with station by ${dueDate}.` : "Schedule with station.")
        };
      }

      function upsertImportedOrders(importedOrders) {
        let created = 0;
        let updated = 0;
        importedOrders.forEach(imported => {
          const index = orders.findIndex(order => String(order.trackingNumber || "").trim() === imported.trackingNumber);
          if (index === -1) {
            orders.push(imported);
            created += 1;
            return;
          }
          orders[index] = {
            ...orders[index],
            location: imported.location || orders[index].location,
            classOfWork: imported.classOfWork || orders[index].classOfWork,
            jobDescription: imported.jobDescription || orders[index].jobDescription,
            cost: imported.cost || orders[index].cost,
            status: imported.status || orders[index].status,
            dueDate: imported.dueDate || orders[index].dueDate,
            callDate: imported.callDate || orders[index].callDate,
            assignedTo: orders[index].assignedTo || imported.assignedTo,
            notes: orders[index].notes || imported.notes,
            nextStep: orders[index].nextStep || imported.nextStep
          };
          updated += 1;
        });
        selectedId = orders[0]?.id || null;
        return { created, updated };
      }

      function formatImportedCost(value) {
        if (!value) return "";
        if (/^ntq$/i.test(value) || /^nte/i.test(value)) return value.toUpperCase().replace("NTE ", "NTE ");
        const number = Number(String(value).replace(/[^0-9.]/g, ""));
        return Number.isFinite(number) && number > 0 ? `NTE ${number.toFixed(0)}` : value;
      }

      function mapImportedStatus(value, detail = "") {
        if (/cancel/i.test(detail)) return "Canceled";
        if (statuses.includes(value)) return value;
        if (/cancel/i.test(value)) return "Canceled";
        if (/complete|closed|done/i.test(value)) return "Completed";
        if (/quote/i.test(value) || /quote/i.test(detail)) return "Need to quote";
        if (/progress/i.test(value)) return "In progress";
        if (/open|schedule/i.test(value)) return "Scheduled";
        return "NTS";
      }

      function mapImportedPriority(value) {
        if (/high|urgent/i.test(value)) return "High";
        if (/low/i.test(value)) return "Low";
        return "Normal";
      }

      function normalizeImportDate(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return date.toISOString().slice(0, 10);
      }

      function normalizeImportedLocation(value) {
        const location = String(value || "").trim();
        if (!location) return "Unassigned Location";
        if (/^0912\s*-\s*South San Francisco/i.test(location)) return "0912 // South SF";
        return location;
      }

      function toTitleCase(value) {
        return String(value || "").toLowerCase().replace(/\b[a-z]/g, char => char.toUpperCase());
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char]));
      }

      fillOptions();
      render();
      loadRemoteOrders();

      els.form.addEventListener("submit", upsertFromForm);
      els.search.addEventListener("input", renderList);
      els.statusFilter.addEventListener("change", renderList);
      els.locationPages.addEventListener("click", event => {
        const button = event.target.closest("[data-location]");
        if (!button) return;
        activeLocation = button.dataset.location;
        locationCompletedView = false;
        if (!["all", readyToBillPage, canceledPage].includes(activeLocation)) {
          selectedId = pageOrders().find(order => order.status !== "Completed")?.id || pageOrders()[0]?.id || null;
        }
        render();
      });
      els.list.addEventListener("click", event => {
        const completedToggle = event.target.closest("[data-completed-view]");
        if (completedToggle) {
          locationCompletedView = completedToggle.dataset.completedView === "completed";
          const targetOrders = pageOrders().filter(order => locationCompletedView ? order.status === "Completed" : order.status !== "Completed");
          selectedId = targetOrders[0]?.id || null;
          render();
          return;
        }
        const card = event.target.closest("[data-id]");
        if (!card) return;
        selectedId = card.dataset.id;
        render();
      });
      document.querySelector("#newButton").addEventListener("click", createOrder);
      document.querySelector("#duplicateButton").addEventListener("click", duplicateOrder);
      document.querySelector("#deleteButton").addEventListener("click", deleteOrder);
      document.querySelector("#exportButton").addEventListener("click", exportOrders);
      document.querySelector("#printButton").addEventListener("click", () => window.print());
      document.querySelector("#importButton").addEventListener("click", () => els.importFile.click());
      els.importFile.addEventListener("change", event => {
        const [file] = event.target.files;
        if (file) importOrders(file);
        event.target.value = "";
      });
    </script>
  </body>
</html>
